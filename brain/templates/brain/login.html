<!doctype html>
<html lang="es">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ingresar · Segundo cerebro</title>
<h1>Segundo cerebro</h1>
{% if form.errors %}<p>Usuario o contraseña incorrectos.</p>{% endif %}
<form method="post">
  {% csrf_token %}
  <p><label>Usuario<br>{{ form.username }}</label></p>
  <p><label>Contraseña<br>{{ form.password }}</label></p>
  <input type="hidden" name="next" value="{{ next }}">
  <button type="submit">Ingresar</button>
</form>

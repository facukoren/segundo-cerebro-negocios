{% load static %}
<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Ingresar · Segundo cerebro</title>
<link rel="icon" href="{% static 'ui/favicon.svg' %}" type="image/svg+xml">
<link rel="stylesheet" href="{% static 'ui/style.css' %}">
</head>
<body>
<section class="pantalla-acceso" aria-labelledby="acceso-titulo">
  <div class="acceso-card glass">
    <div class="acceso-marca">SEGUNDO CEREBRO</div>
    <h1 id="acceso-titulo">Ingresar</h1>
    <p class="acceso-descripcion">Abrí tu espacio de trabajo.</p>
    <form method="post" class="login-form">
      {% csrf_token %}
      <label for="id_username">Usuario</label>
      <input id="id_username" name="username" autocomplete="username" autofocus required maxlength="150">
      <label for="id_password">Contraseña</label>
      <input id="id_password" name="password" type="password" autocomplete="current-password" required>
      <input type="hidden" name="next" value="{{ next }}">
      {% if form.errors %}<p class="acceso-error" role="alert">Usuario o contraseña incorrectos.</p>{% endif %}
      <button type="submit" class="boton-primario acceso-boton">Entrar</button>
    </form>
  </div>
</section>
</body>
</html>
